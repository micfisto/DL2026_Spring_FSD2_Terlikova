stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_LATEST_TAG: $CI_REGISTRY_IMAGE:latest

# =========================
# LINT BACKEND
# =========================
lint:backend:
  stage: lint
  image: python:3.12
  before_script:
    - cd backend
    - pip install -q flake8 black
  script:
    - flake8 app --max-line-length=120 --ignore=E501,W503
    - black --check app

# =========================
# LINT FRONTEND
# =========================
lint:frontend:
  stage: lint
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint

# =========================
# TEST BACKEND
# =========================
test:backend:
  stage: test
  image: python:3.12
  services:
    - postgres:16
  variables:
    POSTGRES_DB: geoquiz_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres:16/geoquiz_test
  before_script:
    - cd backend
    - pip install -q -r requirements.txt pytest
  script:
    - pytest --cov=app --cov-report=xml || true

# =========================
# TEST FRONTEND (BUILD CHECK)
# =========================
test:frontend:
  stage: test
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

# =========================
# BUILD DOCKER IMAGES
# =========================
build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE_TAG-backend ./backend
    - docker build -t $DOCKER_IMAGE_TAG-frontend ./frontend

    - docker push $DOCKER_IMAGE_TAG-backend
    - docker push $DOCKER_IMAGE_TAG-frontend
  only:
    - main

# =========================
# DEPLOY (SERVER VIA SSH)
# =========================
deploy:server:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -qq -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEPLOY_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_SERVER_HOST "
        cd $DEPLOY_PROJECT_PATH &&
        git pull origin main &&
        docker-compose down &&
        docker-compose pull &&
        docker-compose up -d
      "
  environment:
    name: production
  only:
    - main
  needs:
    - build:docker